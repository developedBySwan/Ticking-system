version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      frontend-production:
        dependency-type: production
        update-types:
          - minor
          - patch
      frontend-development:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      backend-production:
        dependency-type: production
        update-types:
          - minor
          - patch
      backend-development:
        dependency-type: development
        update-types:
          - minor
          - patch
